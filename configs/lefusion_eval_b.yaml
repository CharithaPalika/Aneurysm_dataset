# =====================================================================
#  LeFusion background / mask tests (03b_eval_lefusion.ipynb)
#  Results go to outputs/<run_name>/eval_b/<checkpoint>_<split>/
#
#  1  noisy real          + actual mask
#  2  noisy real          + dilated mask
#  3  noisy pseudo-healthy + actual mask
#  4  noisy pseudo-healthy + dilated mask
#  pseudo-healthy = aneurysm + rim removed, parent vessel kept, filled with tissue
# =====================================================================

# ---- Which model ----
run_name: pilot_64x64x32_small      # must match the training run folder in outputs/
output_dir: outputs
checkpoint: best                  # best | latest | step_001000 ...
use_ema: true

# ---- Which data ----
split: val                        # val | test  (never evaluate on train)
max_patches: 8                    # 0 = all patches of the split

# ---- Generation ----
seed: 123                         # same seed in every test -> fair comparison
jump_length: 5
jump_n_sample: 2
amp: true
vessel_hu: 200                    # voxels brighter than this count as vessel / "filled"

# ---- Dilated mask + pseudo-healthy patch ----
dilate_voxels: 2                  # rim around the aneurysm (0.45 mm voxels -> 0.9 mm)
tissue_ring_voxels: 4             # ring around the rim used for the fill value
noise_blur_sigma: 0.7             # grainy noise like CT (0 = white noise)

# ---- Which tests (run in this order) ----
tests: [1, 2, 3, 4]
