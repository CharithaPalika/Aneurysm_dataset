# =====================================================================
#  Data settings  (read by src/aneurysm/config/data.py -> load_data_config)
#  Which datasets are used + split, preprocessing and patch settings.
#  Each dataset's location and folder layout: configs/data/sources/<name>.yaml
#  Preprocess:  python scripts/run_preprocess.py   (--overwrite to re-cut)
#  Changing "Preprocessing" or "Patches" creates a new patch folder; old ones are kept.
# =====================================================================

# ---- Datasets (true = used; each has a reader in src/aneurysm/data/sources/) ----
datasets:
  zenodo_la: true

# ---- Preprocessed data (inside the project; the raw datasets are only read) ----
work_subdir: work                # -> work/<dataset>/splits.csv and work/<dataset>/patches/<setting>/

# ---- Split (by patient, per dataset) ----
val_frac: 0.15                   # share of the "train" pool (e.g. internal_Tr*) used for validation
split_seed: 42                   # the "test" pool (e.g. internal_Ts*) always goes to test

# ---- Preprocessing ----
spacing_mm: 0.45                 # isotropic voxel size of the patches
hu_min: -100.0                   # intensity window given to the model
hu_max: 900.0
air_hu: -1024.0                  # padding value outside the scan
min_component_voxels: 20         # smaller mask blobs are treated as noise

# ---- Patches ----
patch_size: 64                   # in-plane size H = W
patch_depth: 32                  # number of slices D (null = same as patch_size, i.e. 64^3)
                                 # 32 for the pilot on the 4 GB GPU
patch_margin: 8                  # extra voxels per side stored on disk (random shifts)
hist_bins: 16                    # LeFusion histogram size
